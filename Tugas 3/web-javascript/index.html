<!DOCTYPE html>
<html>

<head>
    <title>Blog Sederhana dengan Array</title>
</head>

<body>
    <h2>Navigasi Konten</h2>
    <button onclick="tampilkanArtikel(0)">1</button>
    <button onclick="tampilkanArtikel(1)">2</button>
    <button onclick="tampilkanArtikel(2)">3</button>
    <hr>
    <div id="konten">
        <h3>Judul Artikel</h3>
        <p>Isi artikel akan tampil di sini.</p>
    </div>
    <script>
        const artikel = [
            {
                judul: "Artikel 1",
                isi: "Ini adalah isi artikel pertama."
            },
            {
                judul: "Artikel 2",
                isi: "Ini adalah isi artikel kedua."
            },
            {
                judul: "Artikel 3",
                isi: "Ini adalah isi artikel ketiga."
            }
        ];
        function tampilkanArtikel(index) {
            document.getElementById("konten").innerHTML =
                "<h3>" + artikel[index].judul + "</h3>" +
                "<p>" + artikel[index].isi + "</p>";
        }
    </script>
</body>

</html>
